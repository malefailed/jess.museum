<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>high contrast test :3</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });
    </script>
</head>
<body>
<div class="background-image"></div>
<div class="header"></div>

    
    <div class="content">
        <p>meowmeowmeow</p>
    </div>
</body>

</html>
